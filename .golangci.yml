version: "2"
run:
  tests: false
  allow-parallel-runners: true
linters:
  enable:
    - bodyclose
    - gocyclo
    - lll
  settings:
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 100
      tab-width: 4
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mendersoftware/#CI_PROJECT_NAME#
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
